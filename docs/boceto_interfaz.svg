<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Fondo -->
  <rect x="0" y="0" width="960" height="760" fill="#f5f6f8"/>
  <rect x="1" y="1" width="958" height="758" fill="none" stroke="#c9ced6" stroke-width="2"/>

  <!-- Barra superior -->
  <rect x="0" y="0" width="960" height="56" fill="#12233f"/>
  <text x="20" y="35" fill="#ffffff" font-size="18" font-weight="bold">Agente RAG de Auditoria Financiera — Banco Andino S.A.</text>
  <text x="700" y="24" fill="#c7d2e3" font-size="11">session_id: auditoria-2026-09-25</text>
  <text x="700" y="40" fill="#c7d2e3" font-size="11">Memoria: buffer (2 turnos)</text>

  <!-- Panel lateral: historial de sesion -->
  <rect x="0" y="56" width="220" height="704" fill="#ffffff" stroke="#d7dbe2" stroke-width="1"/>
  <text x="16" y="82" font-size="12" font-weight="bold" fill="#33404f">HISTORIAL DE LA SESION</text>

  <rect x="12" y="94" width="196" height="70" rx="4" fill="#eef1f5" stroke="#d7dbe2"/>
  <text x="20" y="110" font-size="10" fill="#5a6675">Turno 1</text>
  <text x="20" y="124" font-size="10" fill="#12233f">"¿Monto y RUT de F-1023?"</text>
  <text x="20" y="140" font-size="10" fill="#2e7d32">→ $1.245.000 CLP</text>
  <text x="20" y="154" font-size="10" fill="#2e7d32">→ RUT 76.123.456-7</text>

  <rect x="12" y="172" width="196" height="58" rx="4" fill="#eef1f5" stroke="#d7dbe2"/>
  <text x="20" y="188" font-size="10" fill="#5a6675">Turno 2 (seguimiento)</text>
  <text x="20" y="202" font-size="10" fill="#12233f">"¿Riesgo de esa misma</text>
  <text x="20" y="214" font-size="10" fill="#12233f">factura?"</text>
  <text x="20" y="226" font-size="10" fill="#2e7d32">→ riesgo BAJO</text>

  <text x="16" y="256" font-size="9" fill="#8a93a1">La memoria resuelve "esa</text>
  <text x="16" y="268" font-size="9" fill="#8a93a1">misma factura" sin que el</text>
  <text x="16" y="280" font-size="9" fill="#8a93a1">auditor repita el folio.</text>

  <!-- Campo de pregunta -->
  <text x="236" y="80" font-size="12" font-weight="bold" fill="#33404f">NUEVA PREGUNTA</text>
  <rect x="236" y="90" width="560" height="36" rx="6" fill="#ffffff" stroke="#98a2b3" stroke-width="1.5"/>
  <text x="250" y="113" font-size="13" fill="#6b7280">¿Existen senales de riesgo de fraude en la nota de credito NC-045?</text>
  <rect x="806" y="90" width="118" height="36" rx="6" fill="#12233f"/>
  <text x="865" y="113" font-size="12" fill="#ffffff" text-anchor="middle">Preguntar</text>

  <!-- Tarjeta de respuesta estructurada -->
  <rect x="236" y="140" width="688" height="600" rx="8" fill="#ffffff" stroke="#d7dbe2" stroke-width="1.5"/>
  <text x="252" y="166" font-size="13" font-weight="bold" fill="#12233f">RESPUESTA ESTRUCTURADA (InformeAuditoria)</text>
  <line x1="252" y1="176" x2="908" y2="176" stroke="#e5e8ec"/>

  <!-- Campos monto / rut -->
  <text x="252" y="200" font-size="10" fill="#8a93a1">MONTO TOTAL</text>
  <text x="252" y="220" font-size="16" font-weight="bold" fill="#12233f">$5.000.000 CLP</text>

  <text x="452" y="200" font-size="10" fill="#8a93a1">RUT EMISOR</text>
  <text x="452" y="220" font-size="16" font-weight="bold" fill="#12233f">77.888.999-1</text>

  <text x="652" y="200" font-size="10" fill="#8a93a1">NIVEL DE RIESGO</text>
  <rect x="652" y="206" width="70" height="24" rx="12" fill="#fdeaea"/>
  <text x="687" y="222" font-size="12" font-weight="bold" fill="#c62828" text-anchor="middle">ALTO</text>

  <line x1="252" y1="242" x2="908" y2="242" stroke="#e5e8ec"/>

  <!-- Alertas -->
  <text x="252" y="264" font-size="10" fill="#8a93a1">ALERTAS DETECTADAS</text>
  <rect x="252" y="272" width="640" height="52" rx="4" fill="#fff8e1" stroke="#f0dca0"/>
  <text x="262" y="290" font-size="11" fill="#7a5b00">• Emision multiple del mismo monto en ventana de 24 horas</text>
  <text x="262" y="308" font-size="11" fill="#7a5b00">• Duplicidad de documentos NC-045, NC-045-B, NC-045-C</text>

  <line x1="252" y1="340" x2="908" y2="340" stroke="#e5e8ec"/>

  <!-- Fuente externa -->
  <text x="252" y="362" font-size="10" fill="#8a93a1">FUENTE EXTERNA (mindicador.cl)</text>
  <rect x="252" y="370" width="130" height="24" rx="12" fill="#eceff1"/>
  <text x="317" y="386" font-size="11" fill="#455a64" text-anchor="middle">No utilizada</text>
  <text x="400" y="386" font-size="10" fill="#8a93a1">(esta pregunta no requirio conversion UF/USD → CLP)</text>

  <line x1="252" y1="408" x2="908" y2="408" stroke="#e5e8ec"/>

  <!-- Citas textuales -->
  <text x="252" y="430" font-size="10" fill="#8a93a1">CITAS TEXTUALES (trazabilidad)</text>

  <rect x="252" y="438" width="640" height="46" rx="4" fill="#f3f6fb" stroke="#dbe3ef"/>
  <text x="262" y="454" font-size="10.5" fill="#33404f">"Nota de credito NC-045 (y duplicados NC-045-B, NC-045-C): riesgo</text>
  <text x="262" y="468" font-size="10.5" fill="#33404f">ALTO por emision multiple del mismo monto en 24 horas."</text>
  <rect x="800" y="440" width="90" height="18" rx="9" fill="#e3ecff"/>
  <text x="845" y="453" font-size="9" fill="#1a4fd6" text-anchor="middle">fuente interna</text>

  <rect x="252" y="490" width="640" height="46" rx="4" fill="#f3f6fb" stroke="#dbe3ef"/>
  <text x="262" y="506" font-size="10.5" fill="#33404f">"Se detecto que la Nota de Credito NC-045 fue emitida en 3</text>
  <text x="262" y="520" font-size="10.5" fill="#33404f">ocasiones distintas por exactamente el mismo monto."</text>
  <rect x="770" y="492" width="120" height="18" rx="9" fill="#e3ecff"/>
  <text x="830" y="505" font-size="9" fill="#1a4fd6" text-anchor="middle">nota_credito_NC045.txt</text>

  <!-- Boton fact-check -->
  <rect x="252" y="552" width="220" height="30" rx="6" fill="#eef1f5" stroke="#c9ced6"/>
  <text x="362" y="572" font-size="11" fill="#33404f" text-anchor="middle">Ver verificacion fáctica ✓ 0 contradicciones</text>

  <line x1="252" y1="600" x2="908" y2="600" stroke="#e5e8ec"/>

  <!-- Footer de consumo -->
  <text x="252" y="622" font-size="10" fill="#8a93a1">CONSUMO DE ESTA CONSULTA (AuditCallbackHandler)</text>
  <text x="252" y="642" font-size="11" fill="#33404f">Llamadas: 5</text>
  <text x="352" y="642" font-size="11" fill="#33404f">Tokens: 5.941 in / 1.545 out</text>
  <text x="560" y="642" font-size="11" fill="#33404f">Costo est.: $0,002050 USD</text>
  <text x="750" y="642" font-size="11" fill="#33404f">Latencia: 1,1 s</text>

  <text x="252" y="666" font-size="9" fill="#a3aab4">Valores de ejemplo tomados de una corrida real documentada en docs/comparacion_memoria.md</text>

  <!-- Nota inferior general -->
  <text x="480" y="732" font-size="10" fill="#8a93a1" text-anchor="middle">Boceto conceptual de interfaz — el sistema actual se opera vía script/notebook (ver README.md); no es una UI implementada.</text>
</svg>
